# CI for chmdec — build, amalgamation, sample smoke, fuzz crash regression, WASM.
#
# Full local corpus (testfiles/chm) is optional/gitignored; CI uses tracked
# fuzz/crashes samples that open cleanly for smoke, and replays the full
# crash suite under ASan. Keep the feedback loop under ~15 min.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-clang:
    name: Windows clang + smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build harness
        run: bun cmd/build.ts
      - name: Smoke (list sample that opens cleanly)
        run: |
          $h = "out/clang/chm_test.exe"
          & $h -list fuzz/crashes/crash-uninit-lzx.chm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $h -list fuzz/crashes/crash-70811c9a8c0dfca84706b3825d0fa63f4db58e5a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Amalgamation
        run: bun cmd/build-dist.ts

  windows-clang-fuzz:
    name: Windows clang ASan crash regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Replay tracked fuzz crashes under ASan
        run: bun cmd/fuzz.ts -check-crashes

  linux:
    name: Linux clang + amalgamation + crashes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          # clang for harness; matching libFuzzer for crash replay
          sudo apt-get install -y clang
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libfuzzer-${major}-dev" || \
            sudo apt-get install -y "libclang-rt-${major}-dev" || true
      - name: Build clang harness
        run: bun cmd/build.ts
      - name: Smoke (list sample that opens cleanly)
        run: |
          H=out/clang/chm_test
          test -x "$H"
          "$H" -list fuzz/crashes/crash-uninit-lzx.chm
          "$H" -list fuzz/crashes/crash-70811c9a8c0dfca84706b3825d0fa63f4db58e5a
      - name: Amalgamation
        run: bun cmd/build-dist.ts
      - name: Fuzz crashes (ASan + UBSan)
        env:
          CHM_FUZZ_UBSAN: "1"
        run: bun cmd/fuzz.ts -check-crashes

  wasm:
    name: WASM open/list smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build amalgamation + WASM + verify
        run: bun cmd/verify-wasm.ts fuzz/crashes/crash-uninit-lzx.chm
