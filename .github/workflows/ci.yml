# CI for chmdec — host build, amalgamation, corpus smoke + CHMLib oracle tests
# on Windows, Linux, and macOS, plus fuzz crash regression and WASM.
#
# `bun cmd/tests.ts` downloads public samples into testfiles/chm (gitignored)
# and lists every file. `bun cmd/test.ts testfiles/chm` byte-compares extraction
# against vendored CHMLib. testfiles/ is cached per OS so cold runs pay download
# once.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-clang:
    name: Windows clang + tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache test corpus
        uses: actions/cache@v4
        with:
          path: testfiles
          key: testfiles-v1-windows-${{ hashFiles('cmd/get-deps.ts') }}
          restore-keys: |
            testfiles-v1-windows-
      - name: Smoke + CHMLib oracle tests
        run: |
          bun cmd/tests.ts
          bun cmd/test.ts testfiles/chm
      - name: Amalgamation
        run: bun cmd/build-dist.ts

  windows-clang-fuzz:
    name: Windows clang ASan crash regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Replay tracked fuzz crashes under ASan
        run: bun cmd/fuzz.ts -check-crashes

  linux:
    name: Linux clang + tests + crashes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          # clang for harness; matching libFuzzer for crash replay
          sudo apt-get install -y clang
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libfuzzer-${major}-dev" || \
            sudo apt-get install -y "libclang-rt-${major}-dev" || true
      - name: Cache test corpus
        uses: actions/cache@v4
        with:
          path: testfiles
          key: testfiles-v1-linux-${{ hashFiles('cmd/get-deps.ts') }}
          restore-keys: |
            testfiles-v1-linux-
      - name: Smoke + CHMLib oracle tests
        run: |
          bun cmd/tests.ts
          bun cmd/test.ts testfiles/chm
      - name: Amalgamation
        run: bun cmd/build-dist.ts
      - name: Fuzz crashes (ASan + UBSan)
        env:
          CHM_FUZZ_UBSAN: "1"
        run: bun cmd/fuzz.ts -check-crashes

  macos:
    name: macOS clang + tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache test corpus
        uses: actions/cache@v4
        with:
          path: testfiles
          key: testfiles-v1-macos-${{ hashFiles('cmd/get-deps.ts') }}
          restore-keys: |
            testfiles-v1-macos-
      - name: Smoke + CHMLib oracle tests
        # Apple clang is on the runner.
        run: |
          bun cmd/tests.ts
          bun cmd/test.ts testfiles/chm
      - name: Amalgamation
        run: bun cmd/build-dist.ts

  wasm:
    name: WASM open/list smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-linux-wasm-${{ hashFiles('cmd/build-wasm.ts') }}
          restore-keys: |
            deps-v1-linux-wasm-
      - name: Build amalgamation + WASM + verify
        run: bun cmd/verify-wasm.ts fuzz/crashes/crash-uninit-lzx.chm
